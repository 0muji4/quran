version: v2
clean: true
plugins:
  - local: [go, tool, protoc-gen-go]
    out: apps/backend/internal/gen
    opt:
      - module=quran-project/apps/backend/internal/gen
  - local: [go, tool, protoc-gen-go-grpc]
    out: apps/backend/internal/gen
    opt:
      - module=quran-project/apps/backend/internal/gen
  - local: apps/bff/node_modules/.bin/protoc-gen-ts_proto
    out: apps/bff/src/gen
    opt:
      - outputServices=grpc-js
      - esModuleInterop=true
      - env=node
      - useDate=true
      - unrecognizedEnum=false
