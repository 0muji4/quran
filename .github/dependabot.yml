# Dependabot configuration.
#
# Design notes (see commit message / PR description for full rationale):
# - Cadence is split: security-sensitive ecosystems run weekly, infra-style
#   ecosystems run monthly. Weekly days are spread Mon-Thu to avoid a single
#   "PR flood day".
# - `groups` collapse related minor/patch bumps into one PR each. major
#   bumps still arrive as individual PRs by design.
# - `security-updates` is always its own group so CVE-driven PRs are never
#   delayed by the version-update cadence.
# - iOS (Swift) is intentionally excluded: only one direct dependency
#   (apollo-ios) and macOS runners are expensive. Tracked manually.
version: 2
updates:
  # ---- JS / TS (pnpm workspace at repo root) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels: ["dependencies", "js"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      otel-js:
        patterns: ["@opentelemetry/*"]
        update-types: ["minor", "patch"]
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jsdom"
          - "@playwright/test"
          - "@axe-core/*"
      types:
        patterns: ["@types/*"]
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # next / react majors are gated manually: breaking changes are large
      # and we want to schedule the upgrade, not have it surprise us.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # ---- Go modules (go.work covers three modules) ----
  - package-ecosystem: "gomod"
    directories:
      - "/apps/backend"
      - "/apps/worker/go"
      - "/packages/go-pkg"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      otel-go:
        patterns: ["go.opentelemetry.io/*"]
      testcontainers:
        patterns: ["github.com/testcontainers/*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # ---- Python worker ----
  - package-ecosystem: "pip"
    directory: "/apps/worker/python"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # ---- Dockerfiles (base image bumps) ----
  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
      - "/apps/bff"
      - "/apps/backend"
      - "/apps/worker"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  # ---- GitHub Actions ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # ---- Terraform (GCP providers) ----
  - package-ecosystem: "terraform"
    directory: "/ops/terraform"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "infra"]
    commit-message:
      prefix: "chore(infra)"

  # ---- Gradle (Android) ----
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "android"]
    commit-message:
      prefix: "chore(android)"
    groups:
      androidx:
        patterns: ["androidx.*"]
      compose:
        patterns: ["androidx.compose.*"]
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
