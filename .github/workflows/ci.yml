name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run format check
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

      - name: Setup Go
        uses: actions/setup-go@v5
        env:
          GOTOOLCHAIN: go1.24.5
        with:
          go-version-file: go.work
          cache: true

      - name: Run Go format check
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Install sql-migrate
        run: |
          go install github.com/rubenv/sql-migrate/...@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: sql-migrate dry-run
        run: |
          if [ -f dbconfig.yml ]; then
            sql-migrate up -config=dbconfig.yml -env=development -dryrun;
          else
            echo "dbconfig.yml not found; skipping sql-migrate dry-run";
          fi
