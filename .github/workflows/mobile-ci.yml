name: Mobile CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android app
        run: ./gradlew :apps:android:assembleDebug

      - name: Run Android unit tests
        run: ./gradlew :apps:android:testDebugUnitTest

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    env:
      APOLLO_IOS_CLI_VERSION: 1.25.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apollo iOS CLI
        run: |
          curl -sL "https://github.com/apollographql/apollo-ios/releases/download/${APOLLO_IOS_CLI_VERSION}/apollo-ios-cli.tar.gz" \
            | tar -xz -C /usr/local/bin
          apollo-ios-cli --version

      - name: Verify GraphQL codegen is up-to-date
        run: make codegen-check

      - name: Build iOS app
        run: xcodebuild -scheme QuranRecitationApp -destination "generic/platform=iOS Simulator" build

      - name: Run iOS tests (if present)
        run: |
          if [ -d Tests ]; then
            xcodebuild -scheme QuranRecitationApp -destination "generic/platform=iOS Simulator" test
          else
            echo "No iOS tests directory; skipping tests."
          fi
