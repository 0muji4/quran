name: Mobile CI

# Called from ci.yml with `target: ios | android`. Naive `on.paths`
# filters were removed because skipped required checks are recorded as
# `neutral` and block branch protection; the orchestrator + ci-summary
# pattern in ADR 0014 replaces that.
on:
  workflow_call:
    inputs:
      target:
        description: 'Which mobile platform to build: ios | android.'
        type: string
        required: true

jobs:
  android:
    if: inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android app
        run: ./gradlew :apps:android:assembleDebug

      - name: Run Android unit tests
        run: ./gradlew :apps:android:testDebugUnitTest

  ios:
    if: inputs.target == 'ios'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/ios
    env:
      APOLLO_IOS_CLI_VERSION: 1.25.5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apollo iOS CLI
        run: |
          curl -sL "https://github.com/apollographql/apollo-ios/releases/download/${APOLLO_IOS_CLI_VERSION}/apollo-ios-cli.tar.gz" \
            | tar -xz -C /usr/local/bin
          apollo-ios-cli --version

      - name: Verify GraphQL codegen is up-to-date
        run: make codegen-check

      - name: Build iOS app
        run: xcodebuild -scheme QuranRecitationApp -destination "generic/platform=iOS Simulator" build

      - name: Run iOS tests (if present)
        run: |
          if [ -d Tests ]; then
            # `xcodebuild test` requires a concrete simulator destination — the
            # `generic/platform=iOS Simulator` slug only works for `build`.
            xcodebuild -scheme QuranRecitationApp \
              -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
              test
          else
            echo "No iOS tests directory; skipping tests."
          fi
