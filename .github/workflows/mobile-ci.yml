name: Mobile CI

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/android/**'
      - 'apps/ios/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Build Android app
        run: gradle :apps:android:assembleDebug

      - name: Run Android unit tests
        run: gradle :apps:android:testDebugUnitTest

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS app
        run: xcodebuild -scheme QuranRecitationApp -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" build

      - name: Run iOS tests (if present)
        run: |
          if [ -d apps/ios/Tests ]; then
            xcodebuild -scheme QuranRecitationApp -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" test
          else
            echo "No iOS tests directory; skipping tests."
          fi
