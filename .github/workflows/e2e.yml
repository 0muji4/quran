name: E2E Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Docker Compose services
        run: |
          docker compose -f ops/docker/compose.dev.yml up -d
          echo "Waiting for services to be ready..."

      - name: Wait for services to be healthy
        run: |
          timeout 180 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; echo "Waiting for web service..."; done'
          echo "Web service is ready!"

      - name: Run database migrations
        run: make db-migrate

      - name: Seed database with test data
        run: make db-seed

      # Run Playwright inside the official Docker image so the chromium
      # binary, system fonts, and fontconfig setup are byte-identical
      # to the environment used to regenerate visual baselines locally
      # (see e2e/tests/visual/README.md). Without this, sub-pixel font
      # rendering on the GHA ubuntu-latest runner diverges from the
      # baseline generation environment by ~1% of pixels and visual
      # regression tests fail with no real change.
      #
      # The image is attached to the compose stack's `docker_default`
      # network so the in-container Playwright reaches `web:3000`
      # directly. CI=1 keeps playwright.config.ts from launching its
      # own docker-compose webServer.
      - name: Run E2E tests
        run: |
          docker run --rm \
            --network=docker_default \
            -v "$PWD:/work" \
            -w /work \
            -e E2E_BASE_URL=http://web:3000 \
            -e CI=1 \
            mcr.microsoft.com/playwright:v1.57.0-jammy \
            bash -lc "npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos and traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose -f ops/docker/compose.dev.yml down -v
