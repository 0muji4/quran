name: E2E Tests

# Called from ci.yml when the `e2e` path filter matched. Direct push and
# pull_request triggers are intentionally absent so this workflow only
# runs through the orchestrator. See ADR 0014.
on:
  workflow_call:

jobs:
  e2e:
    # Playwright cannot install browsers on ubuntu-26.04, which ubuntu-latest
    # now resolves to.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    env:
      COMPOSE_FILES: -f ops/docker/compose.dev.yml -f ops/docker/compose.ci.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The browsers come from the Playwright Docker image used in
      # "Run E2E tests", so the runner itself installs none. node_modules is
      # still needed: the container runs the suite from the mounted checkout.
      - name: Install dependencies
        run: pnpm install

      # Derive the Docker image tag from the installed @playwright/test
      # version so the image stays in sync with pnpm bumps automatically.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # compose.ci.yml names the images and reads their layers from the
      # GitHub Actions cache. compose.ci-cache-write.yml, which saves them,
      # is added only outside pull requests and only on shard 1; that file
      # explains why. Bake resolves the compose `context: ../..` against its
      # working directory, which a local `source` sets, so it must be
      # ops/docker.
      - name: Build app images
        uses: docker/bake-action@v7
        with:
          source: ops/docker
          files: |
            compose.dev.yml
            compose.ci.yml
            ${{ github.event_name != 'pull_request' && matrix.shard == 1 && 'compose.ci-cache-write.yml' || '' }}
          targets: backend,bff,web
          load: true

      # Starting `web` brings up only what it depends on (bff, backend,
      # postgres, minio, otel-collector). Jaeger, Prometheus, Loki and
      # Grafana are for local debugging and stay down.
      - name: Start Docker Compose services
        run: docker compose $COMPOSE_FILES up -d --no-build web

      - name: Wait for services to be healthy
        run: |
          timeout 180 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; echo "Waiting for web service..."; done'
          echo "Web service is ready!"

      - name: Run database migrations
        run: make db-migrate

      - name: Seed database with test data
        run: make db-seed

      # Run Playwright inside the official Docker image so the chromium
      # binary, system fonts, and fontconfig setup are byte-identical
      # to the environment used to regenerate visual baselines locally
      # (see e2e/tests/visual/README.md). Without this, sub-pixel font
      # rendering on the GHA ubuntu-latest runner diverges from the
      # baseline generation environment by ~1% of pixels and visual
      # regression tests fail with no real change.
      #
      # `--network=host` shares the runner's network namespace with the
      # container so `localhost:3000` inside the container reaches the
      # compose web service published on the host. This matters because
      # Chromium gates secure-context APIs (`navigator.mediaDevices`
      # and friends) on HTTPS or the special `localhost` / `127.0.0.1`
      # hostnames. Routing tests through `localhost` keeps recorder
      # tests (recording-flow, keyboard-flow, the visual recording
      # scene) working without resorting to the unstable
      # `--unsafely-treat-insecure-origin-as-secure` chromium flag.
      # Linux GHA runners support host networking; local macOS runs use
      # `--network=docker_default` + `web:3000` per the visual README.
      #
      # CI=1 keeps playwright.config.ts from launching its own
      # docker-compose webServer; the stack is already up.
      - name: Run E2E tests
        run: |
          docker run --rm \
            --network=host \
            -v "$PWD:/work" \
            -w /work \
            -e E2E_BASE_URL=http://localhost:3000 \
            -e CI=1 \
            mcr.microsoft.com/playwright:v${{ steps.playwright.outputs.version }}-jammy \
            bash -lc "npx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos and traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose $COMPOSE_FILES down -v
