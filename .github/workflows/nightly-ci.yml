name: Nightly Full CI

# Safety net for the path-filter pattern: runs the entire CI graph
# unconditionally so any silent under-execution caused by a missing
# entry in .github/filters.yml surfaces within 24h. See ADR 0014
# §"Why a nightly full-CI is mandatory rather than optional".
#
# Also runs the cross-browser e2e matrix (firefox + webkit) that
# PR-time CI deliberately skips for speed. See ADR 0017.
#
# Cron fires from the default branch (currently `develop`). Once
# `main` exists, this workflow should grow a branch matrix.
on:
  schedule:
    - cron: '0 18 * * *'   # 03:00 JST daily, outside Asia working hours
  workflow_dispatch:

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  # Catches one-way migrations: a broken DOWN file does not show up in
  # day-to-day PR CI (we only roll forward there) but bites the moment
  # an emergency rollback is needed. Running up → down -all → up nightly
  # against a fresh Postgres surfaces broken reversibility within 24h,
  # in line with the cadence used by the path-filter safety-net job above.
  #
  # Image versions match ops/docker/compose.dev.yml exactly so a passing
  # nightly is evidence that the same migrate CLI a developer runs locally
  # (`make db-migrate`) reproduces the same round-trip.
  migration-roundtrip:
    name: Migration round-trip (up → down → up)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quran_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/quran_project?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply UP migrations (initial)
        run: |
          docker run --rm --network=host \
            -v "$PWD/db/migrations:/migrations" \
            migrate/migrate:v4.17.1 \
            -path=/migrations -database "$DATABASE_URL" up

      # `down -all` is interactive in the migrate CLI to guard against a
      # foot-gun in dev shells; piping `y` is the documented way to
      # confirm it non-interactively in CI.
      - name: Roll DOWN all
        run: |
          echo y | docker run --rm -i --network=host \
            -v "$PWD/db/migrations:/migrations" \
            migrate/migrate:v4.17.1 \
            -path=/migrations -database "$DATABASE_URL" down -all

      - name: Re-apply UP migrations
        run: |
          docker run --rm --network=host \
            -v "$PWD/db/migrations:/migrations" \
            migrate/migrate:v4.17.1 \
            -path=/migrations -database "$DATABASE_URL" up

      # Belt-and-braces: after the round-trip the schema must contain the
      # tables the application reads from, in case a broken DOWN left the
      # DB in a partially-migrated state that the migrate CLI's own
      # exit-code did not catch.
      - name: Verify expected tables exist
        run: |
          docker run --rm --network=host \
            -e PGPASSWORD=postgres \
            postgres:18-alpine \
            psql -h localhost -U postgres -d quran_project -tAc \
              "SELECT count(*) FROM information_schema.tables
               WHERE table_schema = 'public'
                 AND table_name IN ('surahs','ayahs','scoring_jobs','users')" \
            | tee /tmp/count
          test "$(cat /tmp/count)" = "4"

  cross-browser-e2e:
    name: Cross-browser e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Start Docker Compose services
        run: docker compose -f ops/docker/compose.dev.yml up -d

      - name: Wait for services to be healthy
        run: |
          timeout 180 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'

      - name: Run database migrations
        run: make db-migrate

      - name: Seed database with test data
        run: make db-seed

      - name: Run Playwright (${{ matrix.browser }})
        env:
          E2E_BASE_URL: http://localhost:3000
          CI: '1'
          E2E_CROSS_BROWSER: 'true'
        run: pnpm exec playwright test --project=${{ matrix.browser }}-desktop

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-cross-browser-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

      - name: Shutdown Docker Compose
        if: always()
        run: docker compose -f ops/docker/compose.dev.yml down -v
