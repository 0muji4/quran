name: Tests

# Called from ci.yml after dorny/paths-filter resolves which stacks
# changed. Direct push/pull_request triggers are intentionally absent
# so this workflow only runs through the orchestrator (avoids double
# execution and lets ci-summary aggregate the result). See ADR 0014.
on:
  workflow_call:
    inputs:
      js:
        description: "Run JS test jobs ('true' / 'false')."
        type: string
        default: 'false'
      go:
        description: "Run Go test jobs ('true' / 'false')."
        type: string
        default: 'false'

jobs:
  backend-tests:
    if: inputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quran_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        command: server /data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        env:
          GOTOOLCHAIN: go1.24.5
        with:
          go-version-file: go.work
          cache: true

      - name: Run backend tests with coverage
        run: go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./apps/backend/... ./packages/go-pkg/...

      - name: Check Go coverage threshold
        # TODO(#73): Restore the 80% threshold by adding tests in apps/backend
        # and packages/go-pkg. Until then, do not lower this value further;
        # ratchet it up as coverage improves.
        run: |
          chmod +x scripts/check-go-coverage.sh
          ./scripts/check-go-coverage.sh coverage.out 48.0

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 30

      - name: Generate Go coverage HTML report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload Go coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-html
          path: coverage.html
          retention-days: 30

  bff-tests:
    if: inputs.js == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quran_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio123
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        command: server /data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run BFF tests with coverage
        run: pnpm --filter @quran-project/bff test:coverage

      - name: Upload BFF coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: bff-coverage
          path: apps/bff/coverage/
          retention-days: 30

  web-tests:
    if: inputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run Web tests with coverage
        run: pnpm --filter @quran-project/web test:coverage

      - name: Upload Web coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 30

  ui-tests:
    if: inputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run UI tests with coverage
        run: pnpm --filter @quran-project/ui test:coverage

      - name: Upload UI coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: packages/ui/coverage/
          retention-days: 30
