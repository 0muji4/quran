name: Start the e2e stack
description: >-
  Builds the backend, bff and web images, starts web and the services it
  depends on, and applies the migrations and seed data. The caller stops
  the stack with `docker compose -f ops/docker/compose.dev.yml down -v`.

inputs:
  write-cache:
    description: >-
      'true' saves the image layers to the GitHub Actions cache. Only e2e.yml
      passes it, and only outside pull requests; compose.ci-cache-write.yml
      explains why.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    # compose.ci.yml names the images and reads their layers from the
    # GitHub Actions cache. Bake resolves the compose `context: ../..`
    # against its working directory, which a local `source` sets, so it
    # must be ops/docker.
    - name: Build app images
      uses: docker/bake-action@v7
      with:
        source: ops/docker
        files: |
          compose.dev.yml
          compose.ci.yml
          ${{ inputs.write-cache == 'true' && 'compose.ci-cache-write.yml' || '' }}
        targets: backend,bff,web
        load: true

    # Starting `web` brings up only what it depends on (bff, backend,
    # postgres, minio, otel-collector). Jaeger, Prometheus, Loki and
    # Grafana are for local debugging and stay down.
    - name: Start Docker Compose services
      shell: bash
      env:
        COMPOSE_FILE: ops/docker/compose.dev.yml:ops/docker/compose.ci.yml
      run: docker compose up -d --no-build web

    - name: Wait for services to be healthy
      shell: bash
      run: |
        timeout 180 bash -c 'until curl -f http://localhost:3000 > /dev/null 2>&1; do sleep 2; echo "Waiting for web service..."; done'
        echo "Web service is ready!"

    - name: Run database migrations
      shell: bash
      run: make db-migrate

    - name: Seed database with test data
      shell: bash
      run: make db-seed
