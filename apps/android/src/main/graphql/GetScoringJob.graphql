query GetScoringJob($jobId: ID!) {
  scoringJob(jobId: $jobId) {
    jobId
    status
    score
    verdict
    segments {
      label
      score
    }
    feedback {
      accuracy
      completeness
      overall
      referenceAudioUrl
      transcript
      wer
      cer
      wordAlignments {
        refWord
        hypWord
        op
      }
    }
  }
}
