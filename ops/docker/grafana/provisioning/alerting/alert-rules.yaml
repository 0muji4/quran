apiVersion: 1

groups:
  - orgId: 1
    name: quran-project-alerts
    folder: Quran Project
    interval: 1m
    rules:
      - uid: high-error-rate
        title: High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(rate(http_server_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_server_requests_total[5m])) by (job) * 100
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'Error rate for {{ $labels.job }} is {{ $value }}%, which exceeds the 5% threshold'
          summary: High error rate detected
        labels:
          severity: critical
          team: sre

      - uid: high-latency-p95
        title: High P95 Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(http_server_duration_bucket[5m])) by (le, job))
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  type: query
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          description: 'P95 latency for {{ $labels.job }} is {{ $value }}ms, which exceeds the 1000ms threshold'
          summary: High P95 latency detected
        labels:
          severity: warning
          team: sre

      - uid: service-down
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: Prometheus
            model:
              expr: up{job=~"web|bff|backend"}
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              reducer: last
              expression: A
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          description: 'Service {{ $labels.job }} is down (up == 0)'
          summary: Service is down
        labels:
          severity: critical
          team: sre
