version: '3.9'

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 Docker image stores data under a major-version
      # subdirectory of `/var/lib/postgresql` (e.g.
      # `/var/lib/postgresql/18/docker/`) to keep pg_upgrade workflows
      # clean. Mounting the named volume at the parent path is the
      # upstream-recommended layout for 18+; the 16-era
      # `/var/lib/postgresql/data` mount makes the 18 entrypoint
      # refuse to start because it treats the legacy directory as
      # leftover data from a previous major version. See
      # docker-library/postgres#37 + #1259.
      - postgres_data:/var/lib/postgresql

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:3000,http://localhost:8080'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - otel_data:/var/lib/otelcol
    ports:
      - '4318:4318' # OTLP HTTP receiver
      - '8888:8888' # Prometheus metrics (collector internal)
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.54
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
      - '4317:4317' # OTLP gRPC receiver
    restart: unless-stopped
    volumes:
      - jaeger_data:/tmp

  prometheus:
    image: prom/prometheus:v2.49.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - '3100:3100'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3200
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - '3200:3000'
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: quran-backend
      SERVICE_VERSION: '0.1.0'
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - '8080:8080'

  bff:
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_started
      otel-collector:
        condition: service_started
    extra_hosts:
      - 'localhost:host-gateway'
    environment:
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      JWT_SECRET: local-jwt-secret
      REFRESH_TOKEN_SECRET: local-refresh-secret
      # Google sign-in (web). Client ID is public; the secret drives the
      # auth-code exchange. Both via substitution so the tracked file is not
      # pinned to a GCP project — set them in ops/docker/.env or via shell
      # export. Either empty = /auth/google returns 503.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # MOCK_SESSION only takes effect when NODE_ENV != production
      # (apps/bff/src/auth/auth.ts). The BFF Dockerfile pins
      # NODE_ENV=production for the runtime image, so override it back
      # to development here — compose.dev.yml is the dev / CI stack and
      # never deploys to real production (Cloud Run uses its own env).
      # Without this override, /scoring-jobs/:id and /me/* would 401
      # against the seeded mock user and the visual result-scene
      # baseline (db/seed.sql) cannot be rendered.
      NODE_ENV: development
      MOCK_SESSION: 'true'
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: quran-alignments
      MINIO_SECURE: 'false'
      MINIO_UPLOAD_PREFIX: uploads/
      MINIO_APPLY_BUCKET_POLICY: 'true'
      SIGNED_URL_TTL_SECONDS: '900'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: quran-bff
      SERVICE_VERSION: '0.1.0'
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - '4000:4000'

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - bff
    environment:
      BFF_BASE_URL: http://bff:4000
      # OpenTelemetry configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: quran-web
      SERVICE_VERSION: '0.1.0'
      LOG_LEVEL: info
      LOG_FORMAT: json
    ports:
      - '3000:3000'

  # One-shot migration runner. Invoked via `make db-migrate` and friends,
  # not started by `docker compose up`. The `tools` profile keeps it
  # out of the default dev stack.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ['tools']
    volumes:
      - ../../db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      [
        'migrate',
        '-path=/migrations',
        '-database=postgres://app:app@postgres:5432/app?sslmode=disable'
      ]

volumes:
  postgres_data:
  minio_data:
  otel_data:
  jaeger_data:
  prometheus_data:
  loki_data:
  grafana_data:
