version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:8080"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      REDIS_URL: redis://redis:6379
      QUEUE_AUTH_TOKEN: local-queue-token
    ports:
      - "8080:8080"

  bff:
    build:
      context: ../..
      dockerfile: apps/bff/Dockerfile
    depends_on:
      - backend
      - minio
    environment:
      BACKEND_URL: http://backend:8080
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      JWT_SECRET: local-jwt-secret
      REFRESH_TOKEN_SECRET: local-refresh-secret
      MOCK_SESSION: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_EXTERNAL_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: quran-alignments
      MINIO_SECURE: "false"
      MINIO_UPLOAD_PREFIX: uploads/
      MINIO_APPLY_BUCKET_POLICY: "true"
      SIGNED_URL_TTL_SECONDS: "900"
    ports:
      - "4000:4000"

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: on-failure
    environment:
      BACKEND_URL: http://backend:8080
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgres://app:app@postgres:5432/app?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: quran-alignments
      MINIO_SECURE: "false"
      QUEUE_AUTH_TOKEN: local-queue-token

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - bff
    environment:
      BFF_BASE_URL: http://bff:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
