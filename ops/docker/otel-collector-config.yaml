receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - 'http://localhost:3000'
            - 'http://localhost:4000'
            - 'http://localhost:8080'

  prometheus:
    config:
      scrape_configs:
        - job_name: 'backend'
          scrape_interval: 15s
          static_configs:
            - targets: ['backend:8080']
        - job_name: 'bff'
          scrape_interval: 15s
          static_configs:
            - targets: ['bff:4000']

processors:
  batch:
    timeout: 10s
    send_batch_size: 512

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

  resource:
    attributes:
      - key: service.namespace
        value: quran-project
        action: upsert

  attributes:
    actions:
      # Remove sensitive headers
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true

  # Stream labels come from Loki's otlp_config defaults (service_name,
  # service_namespace, ...). trace_id is structured metadata, not a label.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [otlp_grpc/jaeger, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus_remote_write, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [otlp_http/loki, debug]

  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
