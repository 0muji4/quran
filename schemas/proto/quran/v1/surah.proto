syntax = "proto3";

package quran.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "quran-project/apps/backend/internal/gen/quran/v1;quranpb";

// SurahService reads Qur'an content.
service SurahService {
  // ListSurahs returns every surah in canonical order.
  rpc ListSurahs(ListSurahsRequest) returns (ListSurahsResponse);
  // GetSurah returns one surah, or NOT_FOUND.
  rpc GetSurah(GetSurahRequest) returns (GetSurahResponse);
  // ListAyahs returns the ayahs of one surah in canonical order.
  rpc ListAyahs(ListAyahsRequest) returns (ListAyahsResponse);
  // GetAyah returns one ayah of a surah, or NOT_FOUND.
  rpc GetAyah(GetAyahRequest) returns (GetAyahResponse);
}

// Surah is one chapter of the Qur'an.
message Surah {
  int32 id = 1;
  string name_ar = 2;
  string name_en = 3;
  string revelation_place = 4;
  int32 ayah_count = 5;
  google.protobuf.Struct metadata = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}

// Ayah is one verse of a surah.
message Ayah {
  int64 id = 1;
  int32 surah_id = 2;
  int32 ayah_number = 3;
  string text_ar = 4;
  string text_en = 5;
  string transliteration = 6;
  google.protobuf.Struct metadata = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
}

// ListSurahsRequest is the input of ListSurahs.
message ListSurahsRequest {}

// ListSurahsResponse is the output of ListSurahs.
message ListSurahsResponse {
  repeated Surah surahs = 1;
}

// GetSurahRequest is the input of GetSurah.
message GetSurahRequest {
  int32 surah_id = 1;
}

// GetSurahResponse is the output of GetSurah.
message GetSurahResponse {
  Surah surah = 1;
}

// ListAyahsRequest is the input of ListAyahs.
message ListAyahsRequest {
  int32 surah_id = 1;
}

// ListAyahsResponse is the output of ListAyahs.
message ListAyahsResponse {
  repeated Ayah ayahs = 1;
}

// GetAyahRequest is the input of GetAyah.
message GetAyahRequest {
  int32 surah_id = 1;
  int32 ayah_number = 2;
}

// GetAyahResponse is the output of GetAyah.
message GetAyahResponse {
  Ayah ayah = 1;
}
